name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Host unit/interface tests
        run: cargo test --locked --manifest-path programs/musebook-credit-provider/Cargo.toml --features client
      - name: Install Agave CLI 3.1.10
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Verifiable SBF build (default + devnet)
        run: |
          scripts/build-verifiable.sh default
          scripts/build-verifiable.sh devnet
          mkdir -p target/deploy
          cp target/verifiable/default/musebook_credit_provider.so target/deploy/
      - name: SBF governance tests (LiteSVM)
        run: cargo test --manifest-path tests-svm/Cargo.toml
