[package]
name = "musebook-credit-provider-surfpool-e2e"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
devnet = ["payment_channels/devnet", "payment_channels/devnet-deployment", "musebook_credit_provider/devnet-deployment"]

[dependencies]
musebook_credit_provider = { path = "../programs/musebook-credit-provider", features = ["client"] }
payment_channels = { path = "../vendor/payment-channels/program/payment_channels", features = ["no-entrypoint"] }
pinocchio = "0.11.1"
borsh = "1"
base64 = "0.22"
bincode = "1"
const-crypto = "0.3"
hex = "0.4"
serde_json = "1"
solana-instruction = "3"
solana-keypair = "3"
solana-pubkey = "3"
solana-signer = "3"
solana-transaction = { version = "3", features = ["bincode"] }

[profile.dev]
debug = 0
incremental = false
